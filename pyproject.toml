[project]
name = "phoai"
version = "0.1.0"
description = "Photo critique for beginners where every comment points to evidence on the photo."
readme = "README.md"
authors = [
    { name = "NormanNguyen86", email = "ngocmanh0806@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.8.0",
    "pydantic>=2.14.3",
    "pydantic-settings[yaml]>=2.16.2",
    "pyyaml>=6.0.3",
]

[project.scripts]
phoai = "phoai:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
